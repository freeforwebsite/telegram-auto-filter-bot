<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2828;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-card.success .stat-value { color: var(--success); }
        .stat-card.danger .stat-value { color: var(--danger); }
        .stat-card.primary .stat-value { color: var(--primary); }

        /* Main Content Panel */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        button {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover:not(:disabled) { background-color: var(--danger-hover); }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td { border-bottom: none; }
        
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .movie-name {
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Toast Notification */
        #toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        #toast.show { transform: translateY(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div id="toast">Operation successful!</div>

    <div class="container">
        <header>
            <h1>CineVault Scraper Admin</h1>
            <button class="btn-primary" onclick="loadData()">Refresh Data</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card primary">
                <div class="stat-title">Pending Tasks</div>
                <div class="stat-value" id="stat-pending">-</div>
            </div>
            <div class="stat-card success">
                <div class="stat-title">Completed</div>
                <div class="stat-value" id="stat-completed">-</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-title">Failed</div>
                <div class="stat-value" id="stat-failed">-</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Failed Movies</div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="actionAll('retry_all')" id="btn-retry-all">Retry All Failed</button>
                    <button class="btn-danger" onclick="actionAll('clear_all')" id="btn-clear-all">Clear All Failed</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Movie Name</th>
                            <th>Status</th>
                            <th>Added On</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="failed-table-body">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
﻿        const API_URL = '/api/queue';
        
        async function loadData() {
            try {
                // Fetch Stats
                const statsRes = await fetch(API_URL + '/stats');
                if(statsRes.status === 401) return requestPassword();
                const stats = await statsRes.json();
                
                document.getElementById('stat-pending').innerText = stats.pending;
                document.getElementById('stat-completed').innerText = stats.completed;
                document.getElementById('stat-failed').innerText = stats.failed;

                // Fetch Failed List
                const failedRes = await fetch(API_URL + '/failed');
                const failedMovies = await failedRes.json();
                
                const tbody = document.getElementById('failed-table-body');
                tbody.innerHTML = '';
                
                if (failedMovies.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No failed movies found. Great job!</td></tr>';
                } else {
                    failedMovies.forEach(movie => {
                        const date = new Date(movie.added_on).toLocaleString();
                        const tr = document.createElement('tr');
                        tr.innerHTML = '<tr><td class="movie-name">' + movie.movie_name + '</td>' + 
                                       '<td><span class="badge">Failed</span></td>' + 
                                       '<td style="color: var(--text-muted); font-size: 0.875rem;">' + date + '</td>' + 
                                       '<td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">' + 
                                       '<button class="btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="actionSingle(\'retry\', \'' + movie._id + '\')">Retry</button>' + 
                                       '<button class="btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="actionSingle(\'delete\', \'' + movie._id + '\')">Delete</button>' + 
                                       '</td></tr>';
                        tbody.appendChild(tr);
                    });
                }
                
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
            } catch (error) {
                console.error("Failed to load data:", error);
                showToast("Connection Error", true);
            }
        }

        async function requestPassword() {
            const pwd = prompt("Admin Password Required:");
            if(pwd) {
                document.cookie = "admin_pwd=" + pwd + "; path=/";
                loadData();
            }
        }

        async function actionSingle(action, id) {
            try {
                const res = await fetch(API_URL + '/' + action, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: id})
                });
                if(res.ok) {
                    showToast("Successfully " + action + "ed movie");
                    loadData();
                } else {
                    showToast("Error: " + await res.text(), true);
                }
            } catch(e) { showToast("Network Error", true); }
        }

        async function actionAll(action) {
            if(!confirm("Are you sure you want to " + action.replace('_', ' ') + "?")) return;
            
            const btn = document.getElementById(action === 'retry_all' ? 'btn-retry-all' : 'btn-clear-all');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;
            
            try {
                const res = await fetch(API_URL + '/' + action, { method: 'POST' });
                if(res.ok) {
                    showToast("Successfully processed all");
                    loadData();
                } else {
                    showToast("Error: " + await res.text(), true);
                }
            } catch(e) { 
                showToast("Network Error", true); 
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.borderColor = isError ? 'var(--danger)' : 'var(--border)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', loadData);

</script>
</body>
</html>
